Name: Release

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: erlef/setup-beam@v1
      with:
        otp-version: "26.0"
        elixir-version: "1.15.1" # [Required] Define the Erlang/OTP version
    - name: Publish
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run:
        mix hex.publish --yes
